name: AI Regression & Evaluation CI

on:
  push:
    branches: [ "main", "master", "feat/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ai-regression-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run AI Regression and Evaluation Tests
      run: |
        pytest backend/tests/test_retriever_regressions.py -v
      env:
        PYTHONPATH: ./backend

    - name: Save Evaluation Evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ai-regression-evidence
        path: eval/*.json