groups:
  - name: heritage-baseline
    rules:
      - alert: HeritageApiUnavailable
        expr: up{job="heritage-api"} == 0
        for: 2m
        labels: {severity: critical}
      - alert: HeritageApiHighErrorRate
        expr: sum(rate(heritage_http_errors_total[5m])) / clamp_min(sum(rate(heritage_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
      - alert: HeritageApiHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(heritage_http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels: {severity: warning}
