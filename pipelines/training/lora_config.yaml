# Hugging Face LoRA FP16/BF16, không lượng tử hóa base model khi train.
# Đổi model_id để nâng model; trainer không phụ thuộc tên Qwen.
model_id: Qwen/Qwen3-4B
train_file: data/train.jsonl
valid_file: data/valid.jsonl
output_dir: models/peft-adapter
seed: 42
enable_thinking: false

max_seq_length: 1536
num_train_epochs: 3
batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
# PEFT tự tìm mọi linear layer, không hardcode q_proj/v_proj của một đời Qwen.
target_modules: all-linear

compute_dtype: auto
optimizer: adamw_torch
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.08
max_grad_norm: 1.0

logging_steps: 10
eval_steps: 25
save_steps: 25
save_total_limit: 3
report_to: none
