# Microsoft GraphRAG 3.3.0, global search only; no extra embedding server.
completion_models:
  default_completion_model:
    type: litellm
    model_provider: openai
    model: ${GRAPHRAG_MODEL}
    api_base: ${GRAPHRAG_API_BASE}
    api_key: ${GRAPHRAG_LLM_API_KEY}
    auth_method: api_key
    call_args:
      temperature: 0
    retry:
      type: exponential_backoff
      max_retries: 2

embedding_models: {}
concurrent_requests: 1
async_mode: asyncio

input:
  type: text
  encoding: utf-8
input_storage:
  type: file
  base_dir: input
output_storage:
  type: file
  base_dir: output
table_provider:
  type: parquet

chunking:
  type: tokens
  size: 300
  overlap: 30
  encoding_model: o200k_base

# Official workflows, excluding optional claims and embedding generation.
workflows:
  - load_input_documents
  - create_base_text_units
  - create_final_documents
  - extract_graph
  - finalize_graph
  - create_communities
  - create_final_text_units
  - create_community_reports

extract_graph:
  completion_model_id: default_completion_model
  max_gleanings: 0
summarize_descriptions:
  completion_model_id: default_completion_model
  max_length: 200
  max_input_tokens: 800
extract_claims:
  enabled: false
community_reports:
  completion_model_id: default_completion_model
  max_length: 400
  max_input_length: 1000
global_search:
  completion_model_id: default_completion_model
  max_context_tokens: 1000
  data_max_tokens: 1000
  map_max_length: 200
  reduce_max_length: 400
