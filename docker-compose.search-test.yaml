name: heritage-search-tests

# Opt-in OpenSearch node for Backend integration tests. Root Compose stays external-only.
services:
  opensearch:
    image: opensearchproject/opensearch:3.3.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 2g
    cpus: 2
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_test_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

volumes:
  opensearch_test_data:
