services:
  migrate:
    image: ${BACKEND_IMAGE:-heritage-backend-preserved}
    build: !reset null
  import-data:
    image: ${BACKEND_IMAGE:-heritage-backend-preserved}
    build: !reset null
  backend:
    image: ${BACKEND_IMAGE:-heritage-backend-preserved}
    build: !reset null
    environment:
      RELEASE_REVISION: ${RELEASE_REVISION:?RELEASE_REVISION is required}
  frontend:
    image: ${FRONTEND_IMAGE:-heritage-frontend-preserved}
    build: !reset null
